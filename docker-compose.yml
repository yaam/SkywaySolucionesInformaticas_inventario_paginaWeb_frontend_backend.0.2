services:
  # Backend - API Node.js
  backend:
    build:
      context: ./backend_inventario_node_2023-main
      dockerfile: Dockerfile
    container_name: skyway-backend
    ports:
      - "127.0.0.1:4001:4001"
    environment:
      - PORT=4001
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI:-mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD}@mongodb:27017/inventarios?authSource=admin}
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_TO=${EMAIL_TO}
    volumes:
      # Persistir uploads
      - ./backend_inventario_node_2023-main/uploads:/usr/src/app/uploads
      # Para desarrollo: sincronizar código (comentar en producción)
      # - ./backend_inventario_node_2023-main:/usr/src/app
      # - /usr/src/app/node_modules
    restart: unless-stopped
    networks:
      - skyway-network
    depends_on:
      - mongodb
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend - React
  frontend:
    build:
      context: ./frontend_inventario_react-main
      dockerfile: Dockerfile
      args:
        - REACT_APP_BASE_URL=${REACT_APP_BASE_URL:-/}
    container_name: skyway-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - skyway-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MongoDB (opcional - si deseas usar MongoDB local en lugar de Atlas)
  mongodb:
    image: mongo:6.0
    container_name: skyway-mongodb
    # Sin puerto publicado: solo accesible desde la red interna de Docker
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?Define MONGO_ROOT_PASSWORD en .env}
      - MONGO_INITDB_DATABASE=inventarios
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    restart: unless-stopped
    networks:
      - skyway-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  skyway-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local




