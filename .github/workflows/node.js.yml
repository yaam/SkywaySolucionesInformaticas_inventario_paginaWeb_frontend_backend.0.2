# Builds the backend and frontend packages (the repo root has no package.json).
name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_inventario_node_2023-main
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
    - run: npm install --no-audit --no-fund
    - run: node --check index.js && node -e "require('./middlewares/seguridad')"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_inventario_react-main
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
    - run: npm install --no-audit --no-fund
    - run: npm run build
